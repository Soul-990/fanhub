<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up — Fan Hub Plus</title>
  
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Stylesheet (Green & White Theme) -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100" style="background-color: var(--fanhub-bg-main);">

  <!-- Minimal Sticky Navbar -->
  <nav class="navbar navbar-light navbar-custom">
    <div class="container justify-content-between">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-compass-fill text-success"></i>
        <span>Fan Hub</span>
        <span class="brand-badge">Plus</span>
      </a>
      <a href="index.html" class="btn btn-sm btn-surface">
        <i class="bi bi-arrow-left me-1 text-success"></i>Back to Hub
      </a>
    </div>
  </nav>

  <!-- Sign Up Form Main Container -->
  <main class="d-flex align-items-center justify-content-center flex-grow-1 py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6 col-xl-5">
          <div class="fanhub-card p-4 p-sm-5 shadow-lg bg-white border">
            <div class="text-center mb-4">
              <div class="badge bg-success p-3 mb-2 rounded-circle shadow-sm">
                <i class="bi bi-person-plus-fill fs-4 text-white"></i>
              </div>
              <h2 class="h4 fw-bold text-dark mb-1">Join Fan Hub Plus</h2>
              <p class="text-muted small">Create your free fandom account to explore and save content</p>
            </div>

            <!-- Frontend Demo Sign Up Form -->
            <form id="signupForm">
              <!-- Name -->
              <div class="mb-3">
                <label for="signupName" class="form-label text-dark small fw-semibold">Full Name</label>
                <div class="position-relative">
                  <input type="text" class="form-control form-control-custom pe-4" id="signupName" placeholder="Aarav Khan" required>
                  <i class="bi bi-person position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
                </div>
              </div>

              <!-- Email -->
              <div class="mb-3">
                <label for="signupEmail" class="form-label text-dark small fw-semibold">Email Address</label>
                <div class="position-relative">
                  <input type="email" class="form-control form-control-custom pe-4" id="signupEmail" placeholder="fan@example.com" required>
                  <i class="bi bi-envelope position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
                </div>
              </div>

              <!-- Passwords -->
              <div class="row g-2 mb-3">
                <div class="col-sm-6">
                  <label for="signupPassword" class="form-label text-dark small fw-semibold">Password</label>
                  <input type="password" class="form-control form-control-custom" id="signupPassword" placeholder="••••••••" required>
                </div>
                <div class="col-sm-6">
                  <label for="signupConfirmPassword" class="form-label text-dark small fw-semibold">Confirm Password</label>
                  <input type="password" class="form-control form-control-custom" id="signupConfirmPassword" placeholder="••••••••" required>
                </div>
              </div>

              <!-- Favorite Fandom / Category Selection -->
              <div class="mb-4">
                <label for="signupFandom" class="form-label text-dark small fw-semibold">Favorite Fandom / Category</label>
                <select class="form-select form-select-custom" id="signupFandom" required>
                  <option value="" disabled selected>Select your primary fandom universe</option>
                  <option value="Anime">Anime (Attack on Titan, Jujutsu Kaisen, etc.)</option>
                  <option value="Gaming">Gaming (Cyberpunk, Elden Ring, RPGs)</option>
                  <option value="Movies">Movies (Spider-Verse, Oppenheimer, Sci-Fi)</option>
                  <option value="TV Shows">TV Shows (Stranger Things, The Last of Us)</option>
                  <option value="K-Pop">K-Pop (BTS, BLACKPINK, 5th Gen)</option>
                  <option value="Comics">Comics (DC, Marvel, Graphic Novels)</option>
                  <option value="Manga">Manga (Solo Leveling, One Piece, Manhwa)</option>
                  <option value="Cosplay">Cosplay (Armor crafting, Props, Photos)</option>
                </select>
              </div>

              <!-- Terms agreement check -->
              <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="agreeTerms" required checked>
                <label class="form-check-label text-muted small" for="agreeTerms">
                  I agree to the Community Guidelines & Terms of Service
                </label>
              </div>

              <!-- Sign Up Button -->
              <button type="submit" class="btn btn-brand w-100 py-2 fw-bold">
                <i class="bi bi-rocket-takeoff me-1"></i>Create Free Account
              </button>
            </form>

            <!-- Bottom redirect to login -->
            <div class="text-center mt-4 pt-3 border-top border-light-subtle small text-muted">
              Already have an account? <a href="login.html" class="text-success fw-bold text-decoration-none">Log In</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer-custom py-3 mt-auto">
    <div class="container text-center small" style="color: #a7f3d0;">
      © 2026 Fan Hub Plus. All rights reserved. Green & White Theme.
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/chatbot.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("signupForm");
      if (form) {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const pass = document.getElementById("signupPassword").value;
          const confirmPass = document.getElementById("signupConfirmPassword").value;
          const name = document.getElementById("signupName").value;

          if (pass !== confirmPass) {
            showToast("Passwords do not match. Please verify.", "danger");
            return;
          }

          showToast(`Account created for ${name}! Redirecting to profile...`, "success");
          setTimeout(() => {
            window.location.href = "profile.html";
          }, 1200);
        });
      }
    });
  </script>
</body>
</html>
