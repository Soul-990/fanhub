<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Fan Hub Plus</title>
  
  <!-- Bootstrap 5 CSS CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <!-- Custom Stylesheet (Green & White Theme) -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="d-flex flex-column min-vh-100" style="background-color: var(--fanhub-bg-main);">

  <!-- Minimal Sticky Navbar -->
  <nav class="navbar navbar-light navbar-custom">
    <div class="container justify-content-between">
      <a class="navbar-brand" href="index.html">
        <i class="bi bi-compass-fill text-success"></i>
        <span>Fan Hub</span>
        <span class="brand-badge">Plus</span>
      </a>
      <a href="index.html" class="btn btn-sm btn-surface">
        <i class="bi bi-arrow-left me-1 text-success"></i>Back to Hub
      </a>
    </div>
  </nav>

  <!-- Login Form Main Container -->
  <main class="d-flex align-items-center justify-content-center flex-grow-1 py-5">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5 col-xl-4">
          <div class="fanhub-card p-4 p-sm-5 shadow-lg bg-white border">
            <div class="text-center mb-4">
              <div class="badge bg-success p-3 mb-2 rounded-circle shadow-sm">
                <i class="bi bi-person-lock fs-4 text-white"></i>
              </div>
              <h2 class="h4 fw-bold text-dark mb-1">Welcome Back</h2>
              <p class="text-muted small">Log in to sync your fandom bookmarks and preferences</p>
            </div>

            <!-- Frontend Demo Login Form -->
            <form id="loginForm">
              <!-- Email -->
              <div class="mb-3">
                <label for="loginEmail" class="form-label text-dark small fw-semibold">Email Address</label>
                <div class="position-relative">
                  <input type="email" class="form-control form-control-custom pe-4" id="loginEmail" placeholder="fan@example.com" required>
                  <i class="bi bi-envelope position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
                </div>
              </div>

              <!-- Password -->
              <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                  <label for="loginPassword" class="form-label text-dark small fw-semibold mb-0">Password</label>
                  <a href="#" onclick="alert('Demo prototype notice: Use any test password to sign in.'); return false;" class="small text-success text-decoration-none fw-semibold">
                    Forgot password?
                  </a>
                </div>
                <div class="position-relative">
                  <input type="password" class="form-control form-control-custom pe-4" id="loginPassword" placeholder="••••••••" required>
                  <i class="bi bi-lock position-absolute top-50 end-0 translate-middle-y me-3 text-muted"></i>
                </div>
              </div>

              <!-- Remember Me -->
              <div class="mb-4 form-check">
                <input type="checkbox" class="form-check-input" id="rememberMe" checked>
                <label class="form-check-label text-muted small" for="rememberMe">Remember me on this browser</label>
              </div>

              <!-- Login Button -->
              <button type="submit" class="btn btn-brand w-100 py-2 fw-bold">
                <i class="bi bi-box-arrow-in-right me-1"></i>Log In
              </button>
            </form>

            <!-- Bottom redirect to signup -->
            <div class="text-center mt-4 pt-3 border-top border-light-subtle small text-muted">
              Don't have an account? <a href="signup.html" class="text-success fw-bold text-decoration-none">Sign Up</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer-custom py-3 mt-auto">
    <div class="container text-center small" style="color: #a7f3d0;">
      © 2026 Fan Hub Plus. All rights reserved. Green & White Theme.
    </div>
  </footer>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
  <script src="js/chatbot.js"></script>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const form = document.getElementById("loginForm");
      if (form) {
        form.addEventListener("submit", (e) => {
          e.preventDefault();
          const email = document.getElementById("loginEmail").value;
          showToast(`Welcome back, ${email.split('@')[0]}! Redirecting to your profile...`, "success");
          setTimeout(() => {
            window.location.href = "profile.html";
          }, 1200);
        });
      }
    });
  </script>
</body>
</html>
